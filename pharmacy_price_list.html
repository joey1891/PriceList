<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품가격표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Print Styles */
        @media print {
            /* Reset body background */
            body { 
                background: white !important; 
                margin: 0;
                padding: 0;
                font-size: 11pt;
            }

            /* Setup A4 Page */
            @page {
                size: A4 portrait;
                margin: 15mm;
            }

            /* Main container adjustments */
            #appContainer {
                display: block !important;
                min-height: auto;
            }
            
            main {
                padding: 0 !important;
                margin: 0 !important;
                max-width: none !important;
            }

            /* 인쇄 전용 헤더 스타일 - 크고 깔끔하게 */
            header {
                position: static !important;
                box-shadow: none !important;
                border-bottom: 3px solid #1e293b !important; /* 굵은 밑줄 */
                margin-bottom: 20px !important;
                padding: 10px 0 20px 0 !important;
            }
            
            /* 제목 텍스트 크기 키우기 */
            header h1 {
                font-size: 24pt !important;
                color: #0f172a !important;
            }

            /* Table container adjustments - CRITICAL FOR PRINTING MULTIPLE PAGES */
            .bg-white.rounded-xl.shadow-sm.border.overflow-hidden {
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                overflow: visible !important;
            }

            .overflow-x-auto { 
                overflow: visible !important; 
                max-height: none !important;
            }

            table {
                width: 100% !important;
                min-width: 100% !important;
                border-collapse: collapse !important;
                page-break-inside: auto !important;
            }

            tr { 
                page-break-inside: avoid !important; 
                page-break-after: auto !important; 
            }
            
            thead { 
                display: table-header-group !important; 
            }
            
            tbody { 
                display: table-row-group !important; 
            }

            /* Keep colors for print */
            th {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #f8fafc !important;
                border-bottom: 2px solid #cbd5e1 !important;
                position: static !important;
            }

            th.bg-blue-50\\/50 { background-color: #eff6ff !important; }
            th.bg-emerald-50\\/50 { background-color: #ecfdf5 !important; }

            /* Background colors for group headers */
            tr td.bg-slate-300 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #e2e8f0 !important;
            }
            tr td.bg-slate-100 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #f1f5f9 !important;
            }

            /* Price column colors */
            td.bg-blue-50\\/30 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #eff6ff !important;
            }
            td.bg-emerald-50\\/30 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #ecfdf5 !important;
            }
            
            .text-blue-700 { color: #1d4ed8 !important; }
            .text-emerald-700 { color: #047857 !important; }
            .text-red-400 { color: #f87171 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">

    <!-- Password Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full mx-4">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center">
                    <i data-lucide="lock" class="h-8 w-8 text-blue-600"></i>
                </div>
            </div>
            <h2 class="text-xl font-bold text-center text-slate-800 mb-2">접근 보호</h2>
            <p class="text-sm text-center text-slate-500 mb-6">단가표를 열람하시려면 비밀번호를 입력해주세요.</p>
            
            <form id="passwordForm" class="space-y-4">
                <div>
                    <input type="password" id="passwordInput" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all text-center text-lg tracking-widest"
                        placeholder="****" autocomplete="off" autofocus>
                </div>
                <div id="passwordError" class="text-red-500 text-sm text-center hidden">비밀번호가 올바르지 않습니다.</div>
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2">
                    확인
                </button>
            </form>
        </div>
    </div>

    <!-- Main App Container (Hidden initially) -->
    <div id="appContainer" class="hidden flex-col min-h-screen w-full">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10 print:static print:border-b-4 print:border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i data-lucide="pill" class="text-blue-600 h-8 w-8 print:text-slate-800"></i>
                    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">제품가격표</h1>
                </div>
                <!-- 인쇄 모드에서는 이 영역(버튼들)을 숨김 (print:hidden 속성 사용) -->
                <div class="flex gap-2 sm:gap-3 print:hidden">
                    <button id="loadBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-medium py-2 px-3 sm:px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 text-sm">
                        <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                        <span class="hidden sm:inline">Refresh Data</span>
                    </button>
                    <button id="printBtn" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 px-3 sm:px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 text-sm">
                        <i data-lucide="printer" class="h-4 w-4"></i>
                        <span class="hidden sm:inline">인쇄 / PDF</span>
                    </button>
                    <button id="exportBtn" disabled class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium py-2 px-3 sm:px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2 text-sm">
                        <i data-lucide="download" class="h-4 w-4"></i>
                        <span class="hidden sm:inline">Export to Excel</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow flex flex-col w-full print:py-0 print:px-0">
            
            <div id="notification" class="hidden mb-4 p-4 rounded-lg border print:hidden"></div>

            <!-- Table Container -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col relative print:border-none print:shadow-none print:rounded-none">
                
                <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center print:hidden">
                    <i data-lucide="loader-2" class="h-8 w-8 text-blue-600 animate-spin mb-3"></i>
                    <p class="text-slate-600 font-medium">Loading pricing data...</p>
                </div>

                <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center p-8 text-center bg-white z-0 hidden print:hidden">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="database" class="h-8 w-8 text-slate-400"></i>
                    </div>
                    <h3 class="text-lg font-medium text-slate-900 mb-1">No Data Available</h3>
                    <p class="text-slate-500 max-w-sm">Click "Refresh Data" to load the latest pharmacy price list from the database.</p>
                </div>

                <div class="overflow-x-auto h-full max-h-[70vh] print:overflow-visible print:max-h-none">
                    <table class="w-full text-left border-collapse min-w-[800px] print:min-w-0">
                        <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm print:static print:shadow-none">
                            <tr>
                                <th class="py-3 px-4 font-semibold text-sm text-slate-600 border-b border-slate-200 w-2/5">제품명</th>
                                <th class="py-3 px-4 font-semibold text-sm text-slate-600 border-b border-slate-200 text-right w-1/5">소비자 정가</th>
                                <th class="py-3 px-4 font-semibold text-sm text-blue-700 border-b border-slate-200 text-right bg-blue-50/50 w-1/5">약국 프로모션가</th>
                                <th class="py-3 px-4 font-semibold text-sm text-emerald-700 border-b border-slate-200 text-right bg-emerald-50/50 w-1/5">약국 공급가</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="relative z-0">
                            <!-- Data will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <footer class="mt-6 text-center text-sm text-slate-400 print:hidden">
                Data sourced directly from Supabase. Prices calculated dynamically.
            </footer>
        </main>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Supabase Configuration
        const supabaseUrl = 'https://rayhgqcpupwmwpymtkwg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJheWhncWNwdXB3bXdweW10a3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNjc2MTEsImV4cCI6MjA4NDg0MzYxMX0.Ng4K86amltnarVwbQ8FVfw1rTJK03NTE5g3QDoLMFTc';
        
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentData = [];
        
        // DOM Elements
        const loadBtn = document.getElementById('loadBtn');
        const exportBtn = document.getElementById('exportBtn');
        const printBtn = document.getElementById('printBtn');
        const tableBody = document.getElementById('tableBody');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const emptyState = document.getElementById('emptyState');
        const notification = document.getElementById('notification');
        const appContainer = document.getElementById('appContainer');

        function formatCurrency(amount) {
            if (amount === null || amount === undefined || isNaN(amount)) return '-';
            return new Intl.NumberFormat('en-US', { style: 'decimal', maximumFractionDigits: 0 }).format(amount);
        }

        function showNotification(message, type = 'error') {
            notification.textContent = message;
            notification.className = `mb-4 p-4 rounded-lg border text-sm font-medium print:hidden ${
                type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'
            }`;
            notification.classList.remove('hidden');
            setTimeout(() => notification.classList.add('hidden'), 5000);
        }

        const renameCategory = (catName) => {
            if (!catName) return '기타 (Other)';
            const trimmed = catName.trim();
            if (trimmed === 'Clinic / Pharmacy') return '약국용';
            if (trimmed === 'Home Care') return '일반소비자용';
            if (trimmed.toLowerCase() === 'face') return '얼굴';
            if (trimmed.toLowerCase() === 'scalp') return '두피';
            return trimmed;
        };

        const translationMap = {
            'blue crystal hydrating ampoule': '블루 크리스탈 하이드레이팅 앰플',
            'lift-toning sun protector cream': '리프트 토닝 선 프로텍터 크림',
            'active barrier hydrating cream': '액티브 배리어 하이드레이팅 크림',
            'ev shot skin boosting mask': '이브이 샷 스킨 부스팅 마스크',
            'melano cut brightening ampoule': '멜라노 컷 브라이트닝 앰플',
            'root vitality volume shampoo': '루트 바이탈리티 볼륨 샴푸',
            'expert shot scalp ampoule': '엑스퍼트 샷 스칼프 앰플',
            'phyto protein volumizing ampoule': '파이토 프로틴 볼류마이징 앰플',
            'plan tox lifting ampoule': '플랜톡스 리프팅 앰플',
            'hyper shot': '하이퍼 샷',
            'cellular water ampoule booster': '셀룰러 워터 앰플 부스터',
            'core impact': '코어 임팩트',
            'micro enzyme deep cleansing powder': '마이크로 엔자임 딥 클렌징 파우더',
            'scalp md': '스칼프 MD',
            'medinovae chitogenix spot relief patch': '메디노베 키토제닉스 스팟 릴리프 패치',
            'ampoule': '앰플', 'cream': '크림', 'mask': '마스크', 'shampoo': '샴푸', 'powder': '파우더',
            'cleansing': '클렌징', 'cleanser': '클렌저', 'toner': '토너', 'lotion': '로션', 'serum': '세럼',
            'essence': '에센스', 'sun protector': '선 프로텍터', 'sun block': '선블록', 'sun cream': '선크림',
            'peeling': '필링', 'gel': '젤', 'foam': '폼', 'booster': '부스터', 'hydrating': '하이드레이팅',
            'brightening': '브라이트닝', 'lifting': '리프팅', 'volumizing': '볼류마이징', 'vitality': '바이탈리티',
            'barrier': '배리어', 'active': '액티브', 'deep': '딥', 'micro': '마이크로', 'enzyme': '엔자임'
        };

        function translateToKorean(engName) {
            if (!engName) return '이름 없는 제품';
            let korName = engName;
            for (const [eng, kor] of Object.entries(translationMap)) {
                const regex = new RegExp(eng, 'gi');
                korName = korName.replace(regex, kor);
            }
            return korName;
        }

        async function loadData() {
            try {
                loadingOverlay.classList.remove('hidden');
                emptyState.classList.add('hidden');
                tableBody.innerHTML = '';
                exportBtn.disabled = true;
                currentData = [];

                const { data: catalogData, error: catalogError } = await supabaseClient
                    .from('form_catalog_master')
                    .select('product_id, category, sub_category_1, sub_category_2, unit_price')
                    .not('product_id', 'is', null);

                if (catalogError) throw catalogError;

                const excludedMasterCategories = ['스킨부스터', '메디컬 디바이스', '로 머터리얼'];
                const allowedCatalogProductMap = new Map();

                catalogData.forEach(item => {
                    if (!excludedMasterCategories.includes(item.category)) {
                        allowedCatalogProductMap.set(item.product_id, {
                            sub1: renameCategory(item.sub_category_1),
                            sub2: renameCategory(item.sub_category_2),
                            fallbackUnitPrice: item.unit_price || 0 
                        });
                    }
                });

                catalogData.forEach(item => {
                    if (excludedMasterCategories.includes(item.category)) {
                        allowedCatalogProductMap.delete(item.product_id);
                    }
                });

                const { data, error } = await supabaseClient
                    .from('products')
                    .select(`
                        id, brand, clean_name, main_category, sub_category, type,
                        product_prices:product_prices!fk_product_prices_product_id (b2c_msrp, currency)
                    `)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                currentData = data.filter(product => {
                    if (!allowedCatalogProductMap.has(product.id)) return false;

                    const searchString = [product.clean_name, product.brand, product.main_category, product.sub_category, product.type].filter(Boolean).join(' ').toLowerCase();
                    const excludeKeywords = [
                        '병원', '원료', 'mts', 'skin booster', '스킨부스터', '수정광', '코어임팩2', '품절', 'echrever',
                        'micro enzyme deep cleansing powder', 'root vitality volume shampoo 100ml'
                    ];

                    return !excludeKeywords.some(keyword => searchString.includes(keyword));
                }).map(product => {
                    let msrp = 0;
                    const catInfo = allowedCatalogProductMap.get(product.id);
                    
                    if (product.product_prices) {
                        const prices = Array.isArray(product.product_prices) ? product.product_prices : [product.product_prices];
                        if (prices.length > 0) {
                            let priceKrw = null;
                            let priceUsd = null;
                            prices.forEach(p => {
                                if (p.b2c_msrp != null && Number(p.b2c_msrp) > 0) {
                                    if (p.currency === 'KRW' || !p.currency) priceKrw = Number(p.b2c_msrp);
                                    else if (p.currency === 'USD') priceUsd = Number(p.b2c_msrp) * 1400;
                                }
                            });
                            if (priceKrw !== null) msrp = priceKrw;
                            else if (priceUsd !== null) msrp = priceUsd;
                        }
                    }

                    if (msrp === 0) msrp = Number(catInfo.fallbackUnitPrice) || 0;
                    if (msrp > 0 && msrp < 1000) msrp = msrp * 1400;

                    const isResnovae = product.brand && product.brand.toLowerCase() === 'resnovae';
                    const brandPart = product.brand && !isResnovae ? `[${product.brand}] ` : '';
                    let namePart = translateToKorean(product.clean_name || 'Unnamed Product').replace(/\[?resnovae\]?/gi, '').trim();
                    let fullName = `${brandPart}${namePart}`.trim();

                    if (fullName.includes('코어 임팩트') || fullName.includes('하이퍼 샷')) fullName = `[뷰티기기] ${fullName}`;
                    else if (fullName.includes('스칼프 MD')) fullName = `[의료기기][2등급] ${fullName}`;
                    else fullName = `[화장품] ${fullName}`;

                    if (fullName.includes('스칼프 MD')) msrp = 70000;

                    msrp = Math.round(msrp / 100) * 100;
                    let promoPrice = Math.round((msrp * 0.75) / 100) * 100;
                    let supplyPrice = Math.round((promoPrice * 0.5) / 100) * 100;
                    let overrideSupplyPrice = null;

                    if (fullName.includes('코어 임팩트')) { overrideSupplyPrice = 120000; } 
                    else if (fullName.includes('하이퍼 샷')) { overrideSupplyPrice = 150000; } 
                    else if (fullName.includes('더마플라스트 립밤')) { supplyPrice = 5000; } 
                    else if (fullName.includes('더마플라스트 크림')) { supplyPrice = 18000; } 
                    else if (fullName.includes('스칼프 MD')) { promoPrice = null; supplyPrice = 35000; }

                    return { id: product.id, name: fullName, subCategory1: catInfo.sub1, subCategory2: catInfo.sub2, msrp, promoPrice, supplyPrice, overrideSupplyPrice };
                }).filter(item => item.msrp > 0);

                renderTable(currentData);
            } catch (err) {
                console.error("Error fetching data:", err);
                showNotification("Failed to load data. Please check console for details.", "error");
                emptyState.classList.remove('hidden');
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        function renderTable(data) {
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            exportBtn.disabled = false;
            emptyState.classList.add('hidden');
            const fragment = document.createDocumentFragment();

            const groupedData = data.reduce((acc, item) => {
                const cat1 = item.subCategory1;
                const cat2 = item.subCategory2;
                if (!acc[cat1]) acc[cat1] = {};
                if (!acc[cat1][cat2]) acc[cat1][cat2] = [];
                acc[cat1][cat2].push(item);
                return acc;
            }, {});

            Object.keys(groupedData).sort().forEach(cat1Name => {
                const groupHeader1 = document.createElement('tr');
                groupHeader1.innerHTML = `<td colspan="4" class="py-3 px-4 text-sm font-bold text-slate-800 tracking-wider uppercase bg-slate-300 border-b border-slate-400">📁 ${cat1Name}</td>`;
                fragment.appendChild(groupHeader1);

                Object.keys(groupedData[cat1Name]).sort().forEach(cat2Name => {
                    const groupHeader2 = document.createElement('tr');
                    groupHeader2.innerHTML = `<td colspan="4" class="py-2 px-4 pl-8 text-xs font-bold text-slate-600 tracking-wide bg-slate-100 border-b border-slate-200">↳ ${cat2Name}</td>`;
                    fragment.appendChild(groupHeader2);

                    groupedData[cat1Name][cat2Name].sort((a, b) => {
                        const getSortRank = (itemName) => {
                            if (itemName.includes('[뷰티기기]')) return 0;
                            if ((cat1Name === '얼굴' || cat1Name === 'Face') && cat2Name === '일반소비자용') {
                                if (itemName.includes('앰플 부스터')) return 1;
                                if (itemName.includes('앰플')) return 2;
                                if (itemName.includes('크림')) return 3;
                                if (itemName.includes('마스크')) return 4;
                                return 5;
                            }
                            return 99;
                        };
                        const rankA = getSortRank(a.name);
                        const rankB = getSortRank(b.name);
                        return rankA !== rankB ? rankA - rankB : a.name.localeCompare(b.name); 
                    }).forEach((item) => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50 transition-colors group align-middle border-b border-slate-200';
                        
                        let supplyPriceHtml = formatCurrency(Math.round(item.supplyPrice / 100) * 100);
                        if (item.overrideSupplyPrice !== null) {
                            supplyPriceHtml = `
                                <div class="line-through text-red-400 text-xs font-normal opacity-80 mb-0.5">${formatCurrency(Math.round(item.supplyPrice / 100) * 100)}</div>
                                <div class="font-bold text-emerald-700">${formatCurrency(item.overrideSupplyPrice)}</div>
                            `;
                        }

                        tr.innerHTML = `
                            <td class="py-3 px-4 pl-12 text-sm font-medium text-slate-800 flex items-center gap-2 h-full">
                                <span class="w-1 h-1 rounded-full bg-slate-300 flex-shrink-0"></span>
                                <span class="leading-tight">${item.name}</span>
                            </td>
                            <td class="py-3 px-4 text-sm text-right tabular-nums text-slate-600">
                                ${formatCurrency(Math.round(item.msrp / 100) * 100)}
                            </td>
                            <td class="py-3 px-4 text-sm text-right tabular-nums font-semibold text-blue-700 bg-blue-50/30 group-hover:bg-blue-50/50 transition-colors">
                                ${formatCurrency(item.promoPrice !== null ? Math.round(item.promoPrice / 100) * 100 : null)}
                            </td>
                            <td class="py-3 px-4 text-sm text-right tabular-nums bg-emerald-50/30 group-hover:bg-emerald-50/50 transition-colors">
                                ${supplyPriceHtml}
                            </td>
                        `;
                        fragment.appendChild(tr);
                    });
                });
            });
            tableBody.appendChild(fragment);
        }

        function exportToCSV() {
            if (currentData.length === 0) {
                showNotification("No data to export.", "error");
                return;
            }
            const headers = ['대분류', '소분류', '제품명', '소비자 정가', '약국 프로모션가', '약국 공급가'];
            let csvContent = headers.join(',') + '\n';
            
            [...currentData].sort((a, b) => {
                if (a.subCategory1 === b.subCategory1) {
                    if (a.subCategory2 === b.subCategory2) {
                        const getSortRank = (itemName, cat1, cat2) => {
                            if (itemName.includes('[뷰티기기]')) return 0;
                            if ((cat1.toLowerCase().includes('face') || cat1 === '얼굴') && cat2 === '일반소비자용') {
                                if (itemName.includes('앰플 부스터')) return 1;
                                if (itemName.includes('앰플')) return 2;
                                if (itemName.includes('크림')) return 3;
                                if (itemName.includes('마스크')) return 4;
                                return 5;
                            }
                            return 99;
                        };
                        const rankA = getSortRank(a.name, a.subCategory1, a.subCategory2);
                        const rankB = getSortRank(b.name, b.subCategory1, b.subCategory2);
                        return rankA !== rankB ? rankA - rankB : a.name.localeCompare(b.name);
                    }
                    return a.subCategory2.localeCompare(b.subCategory2);
                }
                return a.subCategory1.localeCompare(b.subCategory1);
            }).forEach(item => {
                const row = [
                    `"${(item.subCategory1 || '').replace(/"/g, '""')}"`,
                    `"${(item.subCategory2 || '').replace(/"/g, '""')}"`,
                    `"${item.name.replace(/"/g, '""')}"`,
                    item.msrp,
                    item.promoPrice !== null ? item.promoPrice : '-',
                    item.overrideSupplyPrice !== null ? item.overrideSupplyPrice : item.supplyPrice
                ];
                csvContent += row.join(',') + '\n';
            });

            const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
            link.setAttribute("href", url);
            link.setAttribute("download", `제품가격표_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        loadBtn.addEventListener('click', loadData);
        exportBtn.addEventListener('click', exportToCSV);
        printBtn.addEventListener('click', () => window.print());

        const TARGET_PASSWORD = "2026";
        const passwordModal = document.getElementById('passwordModal');
        const passwordForm = document.getElementById('passwordForm');
        const passwordInput = document.getElementById('passwordInput');
        const passwordError = document.getElementById('passwordError');

        function unlockApp() {
            passwordModal.classList.add('hidden');
            appContainer.classList.remove('hidden');
            loadData(); // 인증 성공 또는 세션 유지 시 즉시 데이터 로드!
        }

        // 인증 로직 (세션 체크 후 바로 로드)
        if (sessionStorage.getItem('isAuthenticated') === 'true') {
            unlockApp();
        } else {
            setTimeout(() => passwordInput.focus(), 100);
        }

        passwordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (passwordInput.value === TARGET_PASSWORD) {
                sessionStorage.setItem('isAuthenticated', 'true');
                unlockApp();
            } else {
                passwordError.classList.remove('hidden');
                passwordInput.value = '';
                passwordInput.focus();
                passwordForm.classList.add('animate-[shake_0.5s_ease-in-out]');
                setTimeout(() => passwordForm.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
            }
        });
        
        const style = document.createElement('style');
        style.textContent = `@keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }`;
        document.head.appendChild(style);

    </script>
</body>
</html>
